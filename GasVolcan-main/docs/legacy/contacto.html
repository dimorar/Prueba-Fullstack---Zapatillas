<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GasVolcan - Contacto y Registro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container split-view">
        <section class="form-box">
            <h2>Registro de Cliente</h2>
            <form id="register-form">
                <input type="text" id="reg-rut" placeholder="RUN (sin puntos ni guión)" required>
                <input type="text" id="reg-nombre" placeholder="Nombre completo" required>
                <input type="email" id="reg-email" placeholder="Correo (@duoc.cl, @gmail.com)" required>
                <select id="reg-region"><option value="RM">Región Metropolitana</option></select>
                <select id="reg-comuna"><option value="">Cargando comunas...</option></select>
                <button type="submit" class="btn">Registrarse</button>
            </form>
        </section>
        <section class="form-box">
    <h2>Contacto</h2>
    <form id="contact-form">
        <input type="text" id="c-nombre" placeholder="Nombre" required>
        <input type="email" id="c-email" placeholder="Correo" required>
        <textarea id="c-msg" placeholder="Mensaje (máx 500 caracteres)" maxlength="500" required></textarea>
        <button type="submit" class="btn">Enviar</button>
    </form>
</section>
    </main>
    <script src="js/validation.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
